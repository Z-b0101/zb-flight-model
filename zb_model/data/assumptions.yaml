  chord_m:           { value: 0.20,  status: derived,  source: "Gate 1 design lock 2026-10-13" }
  planform:          { value: "rectangular, 8 identical ribs", status: derived, source: "Gate 1; taper rejected A2 (ITERATION_LOG.md)" }
  airfoil:           { value: "MH60", status: derived, source: "AIRFOIL_TRADE.md — winner 2026-10-13" }
