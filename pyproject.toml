[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zb-model"
version = "0.1.0"
description = "Clean-room flight-model math for Project Z!B's sub-250g UAV family"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "nbformat"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zb_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
